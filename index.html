<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>找牛牛</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif;
    background: #FFFFFF; color: #333; min-height: 100vh;
    display: flex; justify-content: center; overflow-x: hidden;
  }
  .game-container {
    width: 100%; max-width: 420px; min-height: 100vh;
    background: white; display: flex; flex-direction: column; padding: 12px 16px 20px;
  }
  .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 12px; }
  .top-left { display: flex; align-items: center; gap: 10px; }
  .settings-btn { width: 32px; height: 32px; border-radius: 50%; background: #F0F0F0; border: none; cursor: pointer; font-size: 16px; color: #888; }
  .level-badge { background: linear-gradient(135deg, #FFE0B2, #FFF8E1); border-radius: 20px; padding: 6px 16px; font-size: 15px; font-weight: 600; color: #E65100; }
  .new-game-btn { background: linear-gradient(135deg, #FF9800, #FFB74D); color: white; border: none; border-radius: 20px; padding: 6px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .new-game-btn:active { transform: scale(0.95); }
  .top-right { display: flex; align-items: center; gap: 10px; }
  .coins { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: #F9A825; }
  .lives { display: flex; gap: 3px; }
  .heart { font-size: 16px; transition: all 0.2s; }
  .heart.lost { opacity: 0.3; transform: scale(0.9); }

  .rules-card { display: flex; background: #F9F9F9; border-radius: 12px; margin: 8px 0 12px; overflow: hidden; border: 1px solid #EEE; }
  .rule-item { flex: 1; text-align: center; padding: 10px 6px; font-size: 11px; color: #666; line-height: 1.4; position: relative; }
  .rule-item:not(:last-child)::after { content: ''; position: absolute; right: 0; top: 20%; height: 60%; width: 1px; background: #E0E0E0; }
  .rule-icon { font-size: 16px; display: block; margin-bottom: 4px; }

  .cow-hint-area { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 0 10px; }
  .cow-icon { font-size: 36px; transition: transform 0.3s; }
  .cow-icon.angry { animation: cowShake 0.5s ease; }
  @keyframes cowShake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-4px)} 40%,80%{transform:translateX(4px)} }
  .remaining-badge { font-size: 15px; font-weight: 600; color: #333; }
  .remaining-num { color: #F44336; font-size: 22px; font-weight: 700; }

  .board-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; margin: 0 0 8px; }
  .board { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); gap: 3px; background: #D5D5D5; border-radius: 10px; padding: 3px; width: 100%; max-width: 380px; aspect-ratio: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .cell { border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; transition: all 0.15s; font-size: 20px; position: relative; }
  .cell:active { transform: scale(0.94); }
  .cell.given { border: 2px solid #A5D6A7; }
  .cell.trial { opacity: 0.7; }
  .cell.error-mark {
    outline: 3px solid #F44336;
    outline-offset: -2px;
    z-index: 2;
    animation: errorPulse 0.8s ease-in-out infinite alternate;
  }
  @keyframes errorPulse {
    from { outline-color: #F44336; }
    to { outline-color: #FF8A80; }
  }
  .cell.hint-glow { animation: hintGlow 1.2s ease-in-out; z-index: 1; }
  @keyframes hintGlow { 0%{box-shadow:0 0 0 #4CAF50} 50%{box-shadow:0 0 18px #4CAF50} 100%{box-shadow:0 0 0 #4CAF50} }

  .confirm-btn { background: linear-gradient(135deg, #4CAF50, #8BC34A); color: white; border: none; border-radius: 20px; padding: 10px 20px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-bottom: 8px; width: 100%; }
  .confirm-btn:active { transform: scale(0.95); }
  .confirm-btn:disabled { background: #E0E0E0; color: #888; cursor: not-allowed; }

  .bottom-controls { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px; gap: 10px; }
  .clear-btn { width: 48px; height: 48px; border-radius: 50%; background: #F0F0F0; border: none; cursor: pointer; font-size: 20px; color: #888; flex-shrink: 0; transition: all 0.2s; }
  .clear-btn:active { transform: scale(0.9); background: #E0E0E0; }
  .tool-cards { display: flex; gap: 10px; flex: 1; justify-content: center; }
  .tool-card { flex: 1; max-width: 120px; background: white; border-radius: 12px; padding: 10px 12px; text-align: center; cursor: pointer; border: 2px solid #EEE; transition: all 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .tool-card.active { border-color: #FF9800; background: #FFF8E1; }
  .tool-card:active { transform: scale(0.95); }
  .tool-icon { font-size: 28px; margin-bottom: 2px; }
  .tool-label { font-size: 12px; color: #888; font-weight: 500; }
  .hint-card { flex: 1; max-width: 120px; background: white; border-radius: 12px; padding: 10px 12px; text-align: center; cursor: pointer; border: 2px solid #90CAF9; transition: all 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .hint-card:active { transform: scale(0.95); }
  .hint-icon { font-size: 28px; margin-bottom: 2px; }
  .hint-label { font-size: 12px; color: #1565C0; font-weight: 600; }

  .bomb-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,0,0,0); display: none; align-items: center; justify-content: center; z-index: 1000; pointer-events: none; }
  .bomb-overlay.show { display: flex; animation: bombFlash 0.6s ease; }
  @keyframes bombFlash { 0%{background:rgba(255,0,0,0)} 30%{background:rgba(255,100,100,0.15)} 100%{background:rgba(255,0,0,0)} }
  .bomb-emoji { font-size: 70px; animation: bombExplode 0.5s ease; }
  @keyframes bombExplode { 0%{transform:scale(0.3) rotate(-20deg);opacity:0} 40%{transform:scale(1.4) rotate(10deg);opacity:1} 70%{transform:scale(0.9) rotate(0)} 100%{transform:scale(1) rotate(0)} }

  .win-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1001; padding: 20px; }
  .win-overlay.show { display: flex; }
  .win-card { background: white; border-radius: 20px; padding: 30px 24px; text-align: center; max-width: 320px; width: 100%; animation: popIn 0.3s ease-out; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
  @keyframes popIn { from{opacity:0;transform:scale(0.8)} to{opacity:1;transform:scale(1)} }
  .win-emoji { font-size: 56px; margin-bottom: 12px; animation: bounce 0.6s ease infinite alternate; }
  @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-10px)} }
  .win-title { font-size: 22px; color: #FF9800; margin-bottom: 6px; font-weight: 700; }
  .win-message { font-size: 15px; color: #666; margin-bottom: 18px; }
  .win-btn { background: linear-gradient(135deg, #FF9800, #FFB74D); color: white; border: none; border-radius: 20px; padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer; }

  .error-toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(244,67,54,0.95); color: white; padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 1002; display: none; text-align: center; max-width: 300px; }
  .error-toast.show { display: block; animation: toastIn 0.3s ease; }
  @keyframes toastIn { from{opacity:0;transform:translate(-50%,-50%) scale(0.8)} to{opacity:1;transform:translate(-50%,-50%) scale(1)} }

  .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; z-index: 2000; }
  .loading-card { text-align: center; padding: 30px; }
  .loading-spinner { width: 44px; height: 44px; border: 4px solid #EEE; border-top-color: #FF9800; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 15px; color: #888; font-weight: 500; }

  @media (max-width: 360px) {
    .game-container { padding: 10px 12px 16px; }
    .rule-item { font-size: 10px; padding: 8px 4px; }
    .tool-icon, .hint-icon { font-size: 24px; }
    .cell { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="game-container">
  <div class="top-bar">
    <div class="top-left">
      <button class="settings-btn">&#9881;&#65039;</button>
      <div class="level-badge">第 <span id="levelNum">1</span> 关</div>
    </div>
    <div class="top-center">
      <button class="new-game-btn" onclick="newPuzzle()">新一局</button>
    </div>
    <div class="top-right">
      <div class="coins">&#x1F4B0; <span id="coinsCount">0</span></div>
      <div class="lives" id="lives"><span class="heart">&#10084;&#65039;</span><span class="heart">&#10084;&#65039;</span><span class="heart">&#10084;&#65039;</span></div>
    </div>
  </div>

  <div class="rules-card">
    <div class="rule-item"><span class="rule-icon">&#x1F3A8;</span>每种颜色<br/>1头小牛</div>
    <div class="rule-item"><span class="rule-icon">&#x2194;&#xFE0F;</span>每行,每列均有<br/>且仅有1头小牛</div>
    <div class="rule-item"><span class="rule-icon">&#x1F6AB;</span>小牛不能相邻<br/>（包括对角线）</div>
  </div>

  <div class="cow-hint-area">
    <div class="cow-icon" id="cowIcon">&#x1F42E;</div>
    <div class="remaining-badge">剩余小牛：<span class="remaining-num" id="remainCount">6</span></div>
  </div>

  <div class="board-wrapper"><div class="board" id="board"></div></div>

  <button class="confirm-btn" id="confirmBtn" onclick="confirmPlacement()">确认摆放</button>

  <div class="bottom-controls">
    <button class="clear-btn" onclick="clearTrial()">&#x1F5D1;&#xFE0F;</button>
    <div class="tool-cards">
      <div class="tool-card active" id="toolCow" onclick="setTool('cow')"><div class="tool-icon">&#x1F42E;</div><div class="tool-label">放牛牛</div></div>
      <div class="tool-card" id="toolX" onclick="setTool('x')"><div class="tool-icon">&#x2716;&#xFE0F;</div><div class="tool-label">打叉子</div></div>
    </div>
    <button class="hint-card" id="hintBtn" onclick="useHint()"><div class="hint-icon">&#x1F4A1;</div><div class="hint-label">提示 <span id="hintCount">3</span></div></button>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-card">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">加载关卡数据中...</div>
  </div>
</div>

<div class="bomb-overlay" id="bombOverlay"><div class="bomb-emoji">&#x1F4A3;</div></div>
<div class="error-toast" id="errorToast"></div>

<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <div class="win-emoji">&#x1F389;&#x1F42E;&#x1F389;</div>
    <div class="win-title">找到所有牛牛啦！</div>
    <div class="win-message" id="winMessage">太棒了！第1关完成</div>
    <button class="win-btn" onclick="newPuzzle()">下一关</button>
  </div>
</div>

<script>
const GRID_SIZE = 6;
const COW_COUNT = 6;
const TOTAL_LEVELS = 1000;

const REGION_COLORS = ['#FF8A8A','#8ECAE6','#FFE066','#95D5A2','#C8B6FF','#FFB74D'];

var levelsData = null;
var levelsLoaded = false;
var solution = [];
var givenCows = [];
var boardState = [];
var trialState = [];
var currentTool = 'cow';
var lives = 3;
var currentLevel = 1;
var hintsRemaining = 3;
var coins = 0;
var regionMap = [];

// ============ 加载关卡数据 ============
async function loadLevelsData() {
  var overlay = document.getElementById('loadingOverlay');
  var text = document.getElementById('loadingText');
  overlay.style.display = 'flex';
  try {
    var resp = await fetch('levels.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var data = await resp.json();
    levelsData = data.levels;
    levelsLoaded = true;
    text.textContent = '关卡数据加载完成，共 ' + levelsData.length + ' 关';
    console.log('关卡数据加载成功，共', levelsData.length, '关');
    await new Promise(function(r) { setTimeout(r, 500); });
    overlay.style.display = 'none';
    return true;
  } catch (e) {
    console.error('加载关卡数据失败:', e);
    text.textContent = '⚠️ 加载失败，请确保 levels.json 与 index.html 在同一目录';
    return false;
  }
}

// ============ 从 levels.json 读取当前关卡 ============
function loadLevel(levelNum) {
  if (!levelsLoaded || !levelsData) {
    console.error('关卡数据未加载');
    return null;
  }
  var idx = levelNum - 1;
  if (idx < 0 || idx >= levelsData.length) {
    console.log('关卡超出范围，回到第1关');
    currentLevel = 1;
    idx = 0;
  }
  var level = levelsData[idx];
  console.log('加载关卡', level.id, '难度', level.difficulty);

  regionMap = level.regions;

  var kr = level.known_cow[0], kc = level.known_cow[1];
  givenCows = [[kr, kc]];

  var sol = [];
  for (var i = 0; i < GRID_SIZE; i++) {
    var row = [];
    for (var j = 0; j < GRID_SIZE; j++) row.push(false);
    sol.push(row);
  }
  for (var k = 0; k < level.solution.length; k++) {
    var pos = level.solution[k];
    sol[pos[0]][pos[1]] = true;
  }
  solution = sol;

  return level;
}

// ============ 新一局 ============
function newPuzzle() {
  console.log('=== newPuzzle called, level:', currentLevel, '===');
  document.getElementById('winOverlay').classList.remove('show');
  var errs = document.querySelectorAll('.cell.error-mark');
  for (var ei = 0; ei < errs.length; ei++) errs[ei].classList.remove('error-mark');

  if (!loadLevel(currentLevel)) {
    console.error('无法加载关卡', currentLevel);
    return;
  }

  lives = 3;
  hintsRemaining = 3;

  boardState = [];
  trialState = [];
  for (var r = 0; r < GRID_SIZE; r++) {
    var bsRow = [], tsRow = [];
    for (var c = 0; c < GRID_SIZE; c++) { bsRow.push(0); tsRow.push(0); }
    boardState.push(bsRow);
    trialState.push(tsRow);
  }
  for (var gi = 0; gi < givenCows.length; gi++) {
    var gr = givenCows[gi][0], gc = givenCows[gi][1];
    boardState[gr][gc] = 1;
    trialState[gr][gc] = 1;
  }

  currentTool = 'cow';
  document.getElementById('levelNum').textContent = currentLevel;
  updateUI();
  renderBoard();
}

function updateUI() {
  document.getElementById('toolCow').classList.toggle('active', currentTool === 'cow');
  document.getElementById('toolX').classList.toggle('active', currentTool === 'x');

  var hearts = document.getElementById('lives').children;
  for (var i = 0; i < 3; i++) hearts[i].classList.toggle('lost', i >= lives);

  var placed = 0;
  for (var r = 0; r < GRID_SIZE; r++)
    for (var c = 0; c < GRID_SIZE; c++)
      if (trialState[r][c] === 1 || trialState[r][c] === 3) placed++;
  document.getElementById('remainCount').textContent = Math.max(0, COW_COUNT - placed);

  document.getElementById('hintCount').textContent = hintsRemaining;
  document.getElementById('hintBtn').style.opacity = hintsRemaining <= 0 ? '0.5' : '1';
}

function setTool(tool) { currentTool = tool; updateUI(); }

function clearTrial() {
  var errs = document.querySelectorAll('.cell.error-mark');
  for (var ei = 0; ei < errs.length; ei++) errs[ei].classList.remove('error-mark');
  for (var r = 0; r < GRID_SIZE; r++)
    for (var c = 0; c < GRID_SIZE; c++)
      if (!isGivenCow(r, c)) trialState[r][c] = boardState[r][c];
  renderBoard();
  updateUI();
}

// ============ 确认摆放 ============
function confirmPlacement() {
  var trialCows = [], trialXs = [];
  for (var r = 0; r < GRID_SIZE; r++) {
    for (var c = 0; c < GRID_SIZE; c++) {
      if (trialState[r][c] === 3) trialCows.push([r, c]);
      if (trialState[r][c] === 4) trialXs.push([r, c]);
    }
  }

  var errors = [];
  var errorCells = [];
  var allCows = givenCows.slice();

  for (var ci = 0; ci < trialCows.length; ci++) allCows.push(trialCows[ci]);

  if (allCows.length !== COW_COUNT) {
    errors.push('需要放置' + COW_COUNT + '头牛，当前有' + allCows.length + '头');
  }

  for (var r = 0; r < GRID_SIZE; r++) {
    var count = 0;
    for (var ai = 0; ai < allCows.length; ai++) if (allCows[ai][0] === r) count++;
    if (count !== 1) {
      errors.push('第' + (r+1) + '行有' + count + '头牛');
      for (var ai = 0; ai < allCows.length; ai++) if (allCows[ai][0] === r) errorCells.push([allCows[ai][0], allCows[ai][1]]);
    }
  }

  for (var c = 0; c < GRID_SIZE; c++) {
    var count = 0;
    for (var ai = 0; ai < allCows.length; ai++) if (allCows[ai][1] === c) count++;
    if (count !== 1) {
      errors.push('第' + (c+1) + '列有' + count + '头牛');
      for (var ai = 0; ai < allCows.length; ai++) if (allCows[ai][1] === c) errorCells.push([allCows[ai][0], allCows[ai][1]]);
    }
  }

  for (var i = 0; i < allCows.length; i++) {
    for (var j = i + 1; j < allCows.length; j++) {
      var r1 = allCows[i][0], c1 = allCows[i][1];
      var r2 = allCows[j][0], c2 = allCows[j][1];
      if (Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1) {
        errors.push('牛牛相邻了');
        errorCells.push([r1, c1], [r2, c2]);
        break;
      }
    }
    if (errors.length > 0) break;
  }

  var regionCount = {};
  for (var ai = 0; ai < allCows.length; ai++) {
    var rr = allCows[ai][0], cc = allCows[ai][1];
    var rid = regionMap[rr][cc];
    if (regionCount[rid]) {
      errors.push('同颜色区域有多头牛');
      for (var bi = 0; bi < allCows.length; bi++) {
        var br = allCows[bi][0], bc = allCows[bi][1];
        if (regionMap[br][bc] === rid) errorCells.push([br, bc]);
      }
      break;
    }
    regionCount[rid] = true;
  }

  for (var xi = 0; xi < trialXs.length; xi++) {
    var xr = trialXs[xi][0], xc = trialXs[xi][1];
    var onCow = false;
    for (var ai = 0; ai < allCows.length; ai++) {
      if (allCows[ai][0] === xr && allCows[ai][1] === xc) { onCow = true; break; }
    }
    if (onCow) {
      errors.push('第' + (xr+1) + '行第' + (xc+1) + '列不能打叉（这里已经有牛）');
      errorCells.push([xr, xc]);
    }
  }

  if (errors.length > 0) {
    showErrorToast(errors.join('\n'));
    showBomb();
    flashErrorCells(errorCells);
    loseLife();
    return;
  }

  for (var ci = 0; ci < trialCows.length; ci++) boardState[trialCows[ci][0]][trialCows[ci][1]] = 1;
  for (var ci = 0; ci < trialXs.length; ci++) boardState[trialXs[ci][0]][trialXs[ci][1]] = 2;
  for (var r = 0; r < GRID_SIZE; r++)
    for (var c = 0; c < GRID_SIZE; c++)
      trialState[r][c] = boardState[r][c];

  renderBoard();
  updateUI();
  checkWin();
}

function flashErrorCells(cells) {
  var errs = document.querySelectorAll('.cell.error-mark');
  for (var ei = 0; ei < errs.length; ei++) errs[ei].classList.remove('error-mark');
  for (var i = 0; i < cells.length; i++) {
    var r = cells[i][0], c = cells[i][1];
    var cell = document.querySelector('.cell[data-row="' + r + '"][data-col="' + c + '"]');
    if (cell) cell.classList.add('error-mark');
  }
}

function showErrorToast(msg) {
  var toast = document.getElementById('errorToast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 2000);
}

// ============ 渲染棋盘 ============
function renderBoard() {
  var board = document.getElementById('board');
  board.innerHTML = '';
  for (var r = 0; r < GRID_SIZE; r++) {
    for (var c = 0; c < GRID_SIZE; c++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var rid = regionMap[r][c];
      cell.style.backgroundColor = REGION_COLORS[rid % REGION_COLORS.length];
      if (isGivenCow(r, c)) cell.classList.add('given');

      var s = trialState[r][c];
      if (s === 1 || s === 3) {
        cell.textContent = '\u{1F42E}';
        if (s === 3) cell.classList.add('trial');
      } else if (s === 2 || s === 4) {
        cell.textContent = '\u274E\uFE0F';
        cell.style.color = '#FF5252';
        cell.style.fontWeight = '900';
        cell.style.fontSize = '16px';
        if (s === 4) cell.classList.add('trial');
      }

      cell.dataset.row = r;
      cell.dataset.col = c;
      cell.addEventListener('click', (function(rr, cc) {
        return function() { handleClick(rr, cc); };
      })(r, c));
      board.appendChild(cell);
    }
  }
}

// ============ 点击 ============
function handleClick(r, c) {
  if (isGivenCow(r, c)) return;

  if (currentTool === 'cow') {
    trialState[r][c] = trialState[r][c] === 3 ? 0 : 3;
  } else {
    trialState[r][c] = trialState[r][c] === 4 ? 0 : 4;
  }
  renderBoard();
  updateUI();
}

// ============ 提示 ============
function useHint() {
  if (hintsRemaining <= 0) return;
  var candidates = [];
  for (var r = 0; r < GRID_SIZE; r++)
    for (var c = 0; c < GRID_SIZE; c++)
      if (!isGivenCow(r, c) && trialState[r][c] === 0)
        candidates.push({r: r, c: c, isCow: solution[r][c]});

  if (candidates.length === 0) return;
  var cowCandidates = [];
  for (var ci = 0; ci < candidates.length; ci++) if (candidates[ci].isCow) cowCandidates.push(candidates[ci]);
  var pick;
  if (cowCandidates.length > 0) {
    pick = cowCandidates[Math.floor(Math.random() * cowCandidates.length)];
  } else {
    pick = candidates[Math.floor(Math.random() * candidates.length)];
  }

  trialState[pick.r][pick.c] = pick.isCow ? 3 : 4;
  hintsRemaining--;

  var cell = document.querySelector('.cell[data-row="' + pick.r + '"][data-col="' + pick.c + '"]');
  if (cell) { cell.classList.add('hint-glow'); setTimeout(function(cl) { return function() { cl.classList.remove('hint-glow'); }; }(cell), 1200); }

  renderBoard();
  updateUI();
}

// ============ 胜利检查 ============
function checkWin() {
  var placedCows = [];
  for (var r = 0; r < GRID_SIZE; r++)
    for (var c = 0; c < GRID_SIZE; c++)
      if (boardState[r][c] === 1) placedCows.push([r, c]);

  if (placedCows.length !== COW_COUNT) return;

  var rset = new Set(), cset = new Set();
  for (var pi = 0; pi < placedCows.length; pi++) {
    var pr = placedCows[pi][0], pc = placedCows[pi][1];
    if (rset.has(pr) || cset.has(pc)) return;
    rset.add(pr); cset.add(pc);
  }
  for (var i = 0; i < placedCows.length; i++)
    for (var j = i + 1; j < placedCows.length; j++)
      if (Math.abs(placedCows[i][0] - placedCows[j][0]) <= 1 && Math.abs(placedCows[i][1] - placedCows[j][1]) <= 1) return;
  var ridSet = new Set();
  for (var pi = 0; pi < placedCows.length; pi++) {
    var pr = placedCows[pi][0], pc = placedCows[pi][1];
    var rid = regionMap[pr][pc];
    if (ridSet.has(rid)) return;
    ridSet.add(rid);
  }
  winGame();
}

function loseLife() {
  lives--;
  updateUI();
  var cow = document.getElementById('cowIcon');
  cow.classList.add('angry');
  setTimeout(function() { cow.classList.remove('angry'); }, 500);
  if (lives <= 0) setTimeout(function() { alert('游戏结束！'); newPuzzle(); }, 800);
}

function winGame() {
  coins += 100;
  document.getElementById('coinsCount').textContent = coins;
  if (currentLevel < TOTAL_LEVELS) {
    document.getElementById('winMessage').textContent = '太棒了！第' + currentLevel + '关完成 +100金币';
    document.getElementById('winOverlay').classList.add('show');
    currentLevel++;
  } else {
    document.getElementById('winMessage').textContent = '\u{1F389} 恭喜通关全部1000关！+100金币';
    document.getElementById('winOverlay').classList.add('show');
    currentLevel = 1;
  }
  document.getElementById('levelNum').textContent = currentLevel;
}

function isGivenCow(r, c) {
  for (var gi = 0; gi < givenCows.length; gi++) if (givenCows[gi][0] === r && givenCows[gi][1] === c) return true;
  return false;
}
function showBomb() {
  var ov = document.getElementById('bombOverlay');
  ov.classList.add('show');
  setTimeout(function() { ov.classList.remove('show'); }, 600);
}

// ============ 入口 ============
document.addEventListener('DOMContentLoaded', async function() {
  var ok = await loadLevelsData();
  if (ok) newPuzzle();
});
</script>
